<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>SPPLab - Performance Studio</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;margin:0;padding:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#err-banner{display:none;background:#b71c1c;color:#fff;font-size:.7rem;padding:4px 8px;user-select:text;-webkit-user-select:text;flex-shrink:0}
header{background:#151515;padding:6px 10px;text-align:center;border-bottom:1px solid #333;flex-shrink:0}
h1{margin:0 0 6px;font-size:clamp(.85rem,3vw,1.1rem);color:#00e5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-bar{display:flex;gap:4px;justify-content:center;align-items:center;width:100%;flex-wrap:wrap;margin-bottom:6px}
.demo-field{display:flex;flex-direction:column;align-items:flex-start}
.demo-field label{font-size:.6rem;color:#00e5ff;margin-bottom:1px;font-weight:bold}
.demo-field input,.demo-field select{background:#222;color:#fff;border:1px solid #00e5ff;padding:4px 5px;border-radius:4px;font-size:clamp(.65rem,2vw,.75rem);outline:none;user-select:text;-webkit-user-select:text}
#module-select{background:#222;color:#fff;border:1px solid #00e5ff;padding:6px 8px;border-radius:6px;font-size:clamp(.7rem,2.5vw,.85rem);outline:none;width:100%;max-width:450px}
.extra-options{display:none;gap:10px;justify-content:center;align-items:center;margin-top:5px;font-size:.75rem;color:#00e5ff}
.extra-options select{background:#222;color:#fff;border:1px solid #00e5ff;padding:2px 6px;border-radius:4px}
.consent-row{margin-top:5px;font-size:.65rem;color:#aaa;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
#sync-status{color:#888}
#stats-bar{display:flex;justify-content:space-between;background:#1a1a1a;padding:6px 12px;font-size:clamp(.65rem,2.2vw,.8rem);font-weight:bold;border-bottom:1px solid #333;flex-shrink:0}
.stat-item span{color:#00e676}
#game-area{flex:1;position:relative;width:100%;overflow:hidden;background:#0e0e0e;display:flex;justify-content:center;align-items:center;padding:10px}
#game-area.has-buttons{padding-bottom:90px}
@keyframes fbok{0%{box-shadow:inset 0 0 0 6px #00e676}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fbbad{0%{box-shadow:inset 0 0 0 6px #ff1744}100%{box-shadow:inset 0 0 0 0 transparent}}
#game-area.fb-ok{animation:fbok .4s}
#game-area.fb-bad{animation:fbbad .4s}
#instruction-card{position:absolute;width:min(92%,480px);max-height:92%;overflow-y:auto;background:rgba(20,20,20,.98);border:2px solid #00e5ff;padding:16px;border-radius:12px;text-align:left;z-index:1000;user-select:text;-webkit-user-select:text}
#instruction-card h3{margin-top:0;color:#00e5ff;font-size:clamp(.95rem,3.5vw,1.2rem);text-align:center}
#instruction-card p{font-size:clamp(.72rem,2.6vw,.85rem);line-height:1.5;color:#ddd;margin-bottom:6px}
.eval-info{background:#181818;border-left:3px solid #00e5ff;padding:6px 8px;font-size:.72rem;color:#bbb;margin-top:6px}
.score-info{background:#111;border-left:3px solid #00e676;padding:6px 8px;font-size:.72rem;color:#aaa;margin-top:6px}
.legs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:6px;font-size:.72rem;background:#111;padding:6px 8px;border-radius:6px}
.legs div{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:1px 0}
.legs .best{color:#00e676;font-weight:bold}
.legs .worst{color:#ff5252;font-weight:bold}
#antisaccade-touch-zone{display:none;position:absolute;width:100%;height:100%;top:0;left:0;z-index:50}
.antisaccade-half{position:absolute;width:50%;height:100%;top:0}
#antisaccade-left-zone{left:0;border-right:1px dashed rgba(255,255,255,.1)}
#antisaccade-right-zone{right:0}
#dual-buttons{display:none;width:calc(100% - 20px);max-width:400px;gap:20px;justify-content:center;z-index:100;position:absolute;bottom:15px}
.choice-btn{flex:1;padding:16px 0;font-size:1rem;font-weight:bold;border-radius:10px;border:2px solid #fff;text-align:center;color:#fff}
.btn-left{background:#ff1744}.btn-right{background:#29b6f6}
#target-circle{position:absolute;transform:translate(-50%,-50%);width:clamp(100px,25vw,140px);height:clamp(100px,25vw,140px);border-radius:50%;background:#000;border:3px solid #fff;display:none;justify-content:center;align-items:center;font-size:clamp(1.2rem,4vw,1.8rem);font-weight:900;text-align:center;padding:8px;z-index:200}
#target-circle.wide{width:auto;height:auto;min-width:150px;border-radius:18px;padding:14px 22px;letter-spacing:2px;white-space:nowrap}
#spatial-grid{display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:100%;height:100%;max-width:500px;max-height:500px;margin:auto;z-index:100}
#spatial-grid.compact{height:52%;align-self:flex-end}
.spatial-btn{border-radius:12px;opacity:.3;transition:opacity .1s;display:flex;justify-content:center;align-items:center;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:900;color:#000;border:2px solid #fff;width:100%;height:100%}
.spatial-btn.active{opacity:1;box-shadow:0 0 35px #fff;transform:scale(.98)}
#spatial-grid.all-on .spatial-btn{opacity:1}
#memory-grid{display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;width:min(70vw,280px);aspect-ratio:1;margin:auto;z-index:100}
.memory-block{background:#222;border:2px solid #00e5ff;border-radius:8px;width:100%;height:100%}
.memory-block.lit{background:#00e5ff!important;box-shadow:0 0 25px #00e5ff!important}
#numpad-grid{display:none;grid-template-columns:repeat(3,1fr);gap:8px;width:min(75vw,260px);margin:auto;z-index:100}
.num-btn{background:#222;border:1px solid #00e5ff;color:#fff;font-size:1.2rem;font-weight:bold;padding:12px 0;border-radius:6px;text-align:center}
#trail-area{display:none;position:relative;width:100%;align-self:stretch;flex:1;z-index:100}
#trail-area svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.trail-node{position:absolute;width:46px;height:46px;border-radius:50%;background:#00e5ff;color:#000;font-weight:900;font-size:1rem;display:flex;justify-content:center;align-items:center;border:2px solid #fff;z-index:2}
.trail-node.done{background:#00e676;opacity:.35}
#controls{padding:8px 12px;background:#151515;display:flex;gap:8px;justify-content:center;flex-shrink:0;border-top:1px solid #333;width:100%}
button{flex:1;max-width:140px;min-height:44px;padding:10px 0;font-size:clamp(.75rem,2.5vw,.9rem);font-weight:bold;border:none;border-radius:6px;cursor:pointer;color:#fff}
.btn-start{background:#00c853}.btn-stop{background:#d50000}.btn-export{background:#0288d1}.btn-mute{background:#444;max-width:80px}
button:disabled{background:#333!important;color:#666!important;cursor:not-allowed}
</style>
</head>
<body>
<div id="err-banner"></div>
<header>
<h1>SPPLab - Performance Studio</h1>
<div class="demo-bar">
<div class="demo-field"><label>Sporcu ID (takma)</label><input type="text" id="athlete-id" value="SP-101" maxlength="32" style="width:85px"></div>
<div class="demo-field"><label>Yaş</label><input type="number" id="athlete-age" value="22" min="5" max="99" style="width:45px"></div>
<div class="demo-field"><label>Cinsiyet</label><select id="athlete-gender" style="width:65px"><option value="Erkek">Erkek</option><option value="Kadin">Kadın</option></select></div>
<div class="demo-field"><label>Branş</label><input type="text" id="athlete-sport" value="Futbol" maxlength="32" style="width:70px"></div>
<div class="demo-field"><label>Baskın El</label><select id="athlete-dominant" style="width:55px"><option value="Sag">Sağ</option><option value="Sol">Sol</option></select></div>
<div class="demo-field"><label>Spor Yılı</label><input type="number" id="athlete-exp" value="5" min="0" max="80" style="width:55px"></div>
</div>
<select id="module-select">
<optgroup label="A. Bilişsel İnhibisyon & Çatışma">
<option value="gonogo">1. Go/No-Go (Baskılama)</option>
<option value="stroop">2. Stroop (Renk-Kelime Çelişkisi)</option>
<option value="simon">3. Simon Effect (Mekânsal Çatışma)</option>
<option value="flanker">4. Flanker Testi (Çeldirici Dikkat)</option>
<option value="antisaccade">5. Anti-Saccade (Refleks Baskılama)</option>
</optgroup>
<optgroup label="B. Nöropsikolojik & Bellek">
<option value="trailA">6. Trail Making A (1-20 Sayı)</option>
<option value="trailB">7. Trail Making B (1-A-2-B...)</option>
<option value="memory">8. Görsel Dizilim Bellek (Corsi)</option>
<option value="nback">9. Spatial N-Back Bellek</option>
<option value="digit_span">10. Görsel Sayı Dizilimi Belleği</option>
</optgroup>
<optgroup label="C. Saha & Kinetik Depar">
<option value="sprint_ball">11. Saha Depar: Top Getirme</option>
<option value="agility_run">12. Renk Koni Çeviklik Deparı</option>
<option value="complex_agility">13. Karmaşık Çift Komut Deparı (Go/No-Go)</option>
<option value="choice_react">14. Çoklu Seçenek Reaksiyon Deparı</option>
<option value="visual_search">15. Görsel Arama & Depar</option>
</optgroup>
</select>
<div class="extra-options" id="opt-digit"><label>Başlangıç uzunluğu: </label><select id="digit-length-select"><option value="4">4 Basamak (Kolay)</option><option value="8">8 Basamak (Zor)</option></select></div>
<div class="extra-options" id="opt-nback"><label>N seviyesi: </label><select id="nback-n-select"><option value="1">1-back</option><option value="2">2-back</option><option value="3">3-back</option></select></div>
<div class="consent-row"><label><input type="checkbox" id="consent"> Verilerimin araştırma amacıyla sunucuya gönderilmesine açık rıza veriyorum (kapalıysa veri sadece bu cihazda kalır).</label><span id="sync-status"></span></div>
</header>

<div id="stats-bar">
<div class="stat-item">Deneme: <span id="stat-trials">0/10</span></div>
<div class="stat-item">Sayaç: <span id="stat-timer">0.00 s</span></div>
<div class="stat-item">Puan: <span id="stat-score">0</span></div>
<div class="stat-item">Hata: <span id="stat-errors">0</span></div>
</div>

<div id="game-area">
<div id="instruction-card"><h3 id="instr-title">Test Yönergesi</h3><p id="instr-text">Test yükleniyor...</p><div id="instr-eval" class="eval-info"></div><div id="instr-score-formula" class="score-info"></div></div>
<div id="antisaccade-touch-zone"><div id="antisaccade-left-zone" class="antisaccade-half"></div><div id="antisaccade-right-zone" class="antisaccade-half"></div></div>
<div id="target-circle"></div>
<div id="dual-buttons"><div class="choice-btn btn-left" id="btn-left-opt">SOL</div><div class="choice-btn btn-right" id="btn-right-opt">SAĞ</div></div>
<div id="spatial-grid">
<div class="spatial-btn" data-key="red" style="background:#ff1744"></div>
<div class="spatial-btn" data-key="blue" style="background:#29b6f6"></div>
<div class="spatial-btn" data-key="green" style="background:#00e676"></div>
<div class="spatial-btn" data-key="yellow" style="background:#ffea00"></div>
</div>
<div id="memory-grid"></div>
<div id="numpad-grid"></div>
<div id="trail-area"></div>
</div>

<div id="controls">
<button id="start-btn" class="btn-start">Başlat</button>
<button id="stop-btn" class="btn-stop" disabled>Durdur</button>
<button id="export-btn" class="btn-export" disabled>CSV İndir</button>
<button id="mute-btn" class="btn-mute">Ses: Açık</button>
</div>

<script>
window.addEventListener('error',function(e){var b=document.getElementById('err-banner');if(b){b.style.display='block';b.textContent='HATA: '+e.message+' (satır '+e.lineno+')';}});

const APP_VERSION="2.3";
const API_URL="";   // Google Apps Script Web App URL'ni yaz; boşsa sunucuya gönderim yok
const API_TOKEN=""; // Sunucuda doğrulayın

const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmt=v=>v==null?"–":Math.round(v);
const msSn=ms=>ms+" ms ("+(ms/1000).toFixed(2)+" sn)";

const COLORS={
red:{hex:'#ff1744',en:'RED',tr:'KIRMIZI',freq:400},
blue:{hex:'#29b6f6',en:'BLUE',tr:'MAVİ',freq:500},
green:{hex:'#00e676',en:'GREEN',tr:'YEŞİL',freq:600},
yellow:{hex:'#ffea00',en:'YELLOW',tr:'SARI',freq:700}};
const KEYS=Object.keys(COLORS);
const SYMBOLS=['▲','●','■','★'];

const moduleSelect=$('module-select'),circle=$('target-circle'),gameArea=$('game-area');
const zoneBox=$('antisaccade-touch-zone'),dualButtons=$('dual-buttons');
const btnLeft=$('btn-left-opt'),btnRight=$('btn-right-opt');
const spatialGrid=$('spatial-grid'),memoryGrid=$('memory-grid'),numpadGrid=$('numpad-grid'),trailArea=$('trail-area');
const instructionCard=$('instruction-card');
const startBtn=$('start-btn'),stopBtn=$('stop-btn'),exportBtn=$('export-btn'),muteBtn=$('mute-btn');
const statTrials=$('stat-trials'),statTimer=$('stat-timer'),statScore=$('stat-score'),statErrors=$('stat-errors');
const cones=Array.from(document.querySelectorAll('.spatial-btn'));

const S={mod:null,run:0,active:false,waiting:false,rows:[],idx:0,total:10,practiceN:0,t0:0,clockStart:0,resp:null,athlete:null,sessionId:'',ctx:{}};

const T={
ids:new Set(),
set(fn,ms){const run=S.run;const id=setTimeout(()=>{T.ids.delete(id);if(run===S.run&&S.active)fn();},ms);T.ids.add(id);return id;},
clear(){T.ids.forEach(clearTimeout);T.ids.clear();}
};

let clockInt=null;
function startClock(){stopClock();S.clockStart=performance.now();clockInt=setInterval(()=>{statTimer.textContent=((performance.now()-S.clockStart)/1000).toFixed(2)+' s';},50);}
function stopClock(){if(clockInt)clearInterval(clockInt);clockInt=null;}

let audioCtx=null,muted=false;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(freq,dur){dur=dur||0.15;if(muted)return;try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(0.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function speak(text){if(muted)return;try{if('speechSynthesis' in window){speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(text);m.lang='en-US';speechSynthesis.speak(m);}}catch(e){}}
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'Ses: Kapalı':'Ses: Açık';if(muted&&'speechSynthesis' in window)speechSynthesis.cancel();});

let wl=null;
async function requestWake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseWake(){if(wl){wl.release().catch(()=>{});wl=null;}}

function fb(ok){gameArea.classList.remove('fb-ok','fb-bad');void gameArea.offsetWidth;gameArea.classList.add(ok?'fb-ok':'fb-bad');}
function setCircle(x,y,o){o=o||{};circle.className=o.wide?'wide':'';circle.style.left=x+'%';circle.style.top=y+'%';circle.style.backgroundColor=o.bg||'#000';circle.style.color=o.color||'#fff';circle.style.pointerEvents=o.events===false?'none':'auto';circle.textContent=o.text||'';circle.style.display='flex';}
function setDual(l,r){btnLeft.textContent=l;btnRight.textContent=r;dualButtons.style.display='flex';gameArea.classList.add('has-buttons');}
function setGrid(o){o=o||{};spatialGrid.style.display='grid';spatialGrid.classList.toggle('compact',!!o.compact);spatialGrid.classList.toggle('all-on',!!o.allOn);cones.forEach((c,i)=>{c.textContent=o.labels?o.labels[i]:'';c.classList.remove('active');});}
function lightCone(key){cones.forEach(c=>c.classList.toggle('active',c.dataset.key===key));}
function hideStim(){circle.style.display='none';zoneBox.style.display='none';numpadGrid.style.display='none';cones.forEach(c=>c.classList.remove('active'));memoryGrid.querySelectorAll('.lit').forEach(b=>b.classList.remove('lit'));}

function present(setup){const run=S.run;setup();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(run!==S.run||!S.active)return;S.t0=performance.now();S.waiting=true;}));}
function delayThenPresent(setup){T.set(()=>present(setup),500+rnd(1300));}
function rtFrom(ev){const now=performance.now();const t=(ev&&ev.timeStamp>0&&ev.timeStamp<=now+5)?ev.timeStamp:now;return Math.max(0,Math.round(t-S.t0));}
const isPractice=()=>S.idx<=S.practiceN;

function record(o){
const p=S.athlete;
const row={sessionId:S.sessionId,timestamp:new Date().toISOString(),version:APP_VERSION,
athleteId:p.id,age:p.age,gender:p.gender,sport:p.sport,dominantSide:p.dominant,experienceYears:p.exp,screen:p.screen,userAgent:p.ua,
module:S.mod,trial:o.trial!==undefined?o.trial:S.idx,
practice:o.practice!==undefined?(o.practice?1:0):(isPractice()?1:0),
condition:o.cond||'',response:o.resp||'',
rt:o.rt==null?null:o.rt,cum:o.cum==null?null:o.cum,
correct:o.correct?1:0,note:o.note||'',score:0};
S.rows.push(row);
row.score=computeScore();
updateStats();
}

function endTrial(o){S.waiting=false;S.resp=null;T.clear();record(o);fb(o.correct);if(!o.correct)beep(150,0.2);hideStim();T.set(nextTrial,o.delay||600);}
function input(src,ev){if(ev&&ev.cancelable)ev.preventDefault();if(!S.active||!S.waiting||!S.resp)return;S.resp(src,ev);}
function nextTrial(){
const m=MODS[S.mod];
if((m.over&&m.over())||(!m.open&&S.idx>=S.practiceN+S.total)){finishTest();return;}
S.idx++;S.waiting=false;
if(!m.open)statTrials.textContent=isPractice()?('Pratik '+S.idx+'/'+S.practiceN):((S.idx-S.practiceN)+'/'+S.total);
m.trial();
}

const okRows=r=>r.filter(x=>x.correct);
const errCount=r=>r.filter(x=>!x.correct).length;
const meanRT=r=>mean(r.filter(x=>x.correct&&x.rt!=null).map(x=>x.rt));
const scRT=div=>r=>(okRows(r).length/r.length)*1000-(meanRT(r)||0)/div-errCount(r)*20;
const spanOf=r=>Math.max.apply(null,[0].concat(okRows(r).map(x=>parseInt(x.condition.slice(1))||0)));

function zinv(p){const t=Math.sqrt(-2*Math.log(p<0.5?p:1-p));const x=t-(2.515517+0.802853*t+0.010328*t*t)/(1+1.432788*t+0.189269*t*t+0.001308*t*t*t);return p<0.5?-x:x;}
function nbackStats(r){
const m=r.filter(x=>x.condition==='MATCH'),n=r.filter(x=>x.condition==='NONMATCH');
const hits=m.filter(x=>x.response==='MATCH').length,fa=n.filter(x=>x.response==='MATCH').length;
const H=(hits+0.5)/(m.length+1),F=(fa+0.5)/(n.length+1);
return{hits:hits,nM:m.length,fa:fa,nN:n.length,d:zinv(H)-zinv(F)};
}

const TRAIL_LEN=20;
function trailStats(r){
const legs=r.filter(x=>x.correct&&x.condition==='REAL');
const done=legs.length>=TRAIL_LEN;
return{legs:legs,sec:done?legs[legs.length-1].cum/1000:null,err:r.filter(x=>!x.correct).length};
}
function trailLegsHtml(legs){
if(!legs.length)return'';
const rts=legs.map(l=>l.rt),best=Math.min.apply(null,rts),worst=Math.max.apply(null,rts);
const items=legs.map(l=>{const cls=l.rt===best?'best':l.rt===worst?'worst':'';return'<div class="'+cls+'"><span>'+l.note+'</span><span>'+(l.rt/1000).toFixed(2)+' sn</span></div>';}).join('');
return'<b>Hedefler arası süreler:</b><div class="legs">'+items+'</div>';
}
function computeScore(){const r=S.rows.filter(x=>!x.practice);if(!r.length)return 0;return Math.max(0,Math.round(MODS[S.mod].score(r)));}
function updateStats(){statErrors.textContent=S.rows.filter(x=>!x.practice&&!x.correct).length;statScore.textContent=computeScore();}
function condEffect(r){
const c=meanRT(r.filter(x=>x.condition==='CONGRUENT')),i=meanRT(r.filter(x=>x.condition==='INCONGRUENT'));
return['Uyumlu ort. RT: '+fmt(c)+' ms','Uyumsuz ort. RT: '+fmt(i)+' ms','Etki (uyumsuz − uyumlu): '+(c!=null&&i!=null?Math.round(i-c)+' ms':'–')];
}

const RT_FORMULA="Puan = Doğruluk×1000 − Ort.RT(ms)/2 − Hata×20 (alıştırma hariç)";
const FIELD_FORMULA="Puan = Doğruluk×1000 − Ort.RT(ms)/10 − Hata×20 (alıştırma hariç)";

/* ---------- Trail Making ---------- */
function trailModule(kind){
const real=kind==='A'?Array.from({length:TRAIL_LEN},(_,i)=>String(i+1)):['1','A','2','B','3','C','4','D','5','E','6','F','7','G','8','H','9','I','10','J'];
const demo1=kind==='A'?['1','2','3','4']:['1','A','2','B'];
const demo2=kind==='A'?['1','2','3','4','5']:['1','A','2','B','3'];
return{
title:kind==='A'?"6. Trail Making Test A":"7. Trail Making Test B",
text:kind==='A'?"1'den 20'ye kadar sayılara sırasıyla dokunun. Önce 2 kısa alıştırma yapılır.":"1-A-2-B-3-C... şeklinde sayı ve harfe dönüşümlü dokunun. Önce 2 kısa alıştırma yapılır.",
eval:kind==='A'?"Ölçülen Yetenek: Görsel Tarama & Motor Hız.":"Ölçülen Yetenek: Görev Değiştirme / Bilişsel Esneklik.",
formula:"Puan = 1000 − Süre(sn)×8 − Hata×30 (sadece GERÇEK aşama)",open:true,practice:0,
score:r=>{const s=trailStats(r);return s.sec==null?0:1000-s.sec*8-s.err*30;},
extra:r=>{
const s=trailStats(r);
const out=['Tamamlama süresi: '+(s.sec==null?'–':s.sec.toFixed(1)+' sn'),'Sıra hatası: '+s.err];
if(s.legs.length){
const rts=s.legs.map(l=>l.rt);
const bi=rts.indexOf(Math.min.apply(null,rts)),wi=rts.indexOf(Math.max.apply(null,rts));
out.push('<span style="color:#00e676">En hızlı aralık: '+s.legs[bi].note+' → '+(rts[bi]/1000).toFixed(2)+' sn</span>',
'<span style="color:#ff5252">En yavaş aralık: '+s.legs[wi].note+' → '+(rts[wi]/1000).toFixed(2)+' sn</span>',
'Ortalama aralık: '+(mean(rts)/1000).toFixed(2)+' sn',
trailLegsHtml(s.legs));
}

},
setup(){S.ctx.stage='P1';trailArea.style.display='block';},
trial(){
const st=S.ctx.stage;
const seq=st==='P1'?demo1:st==='P2'?demo2:real;
S.idx=({P1:1,P2:2,REAL:3})[st];
statTrials.textContent=st==='REAL'?'GERÇEK TEST':('Pratik '+S.idx+'/2');
const isReal=st==='REAL';
trailArea.innerHTML='';
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
trailArea.appendChild(svg);
const W=trailArea.clientWidth,H=trailArea.clientHeight,sz=46,minD=58,pts=[];
seq.forEach(()=>{
let p,tries=0;
do{p={x:rnd(Math.max(1,W-sz)),y:rnd(Math.max(1,H-sz))};tries++;}
while(tries<600&&pts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<minD));
pts.push(p);
});
S.ctx.next=0;S.ctx.prev=null;S.ctx.lastCum=0;
seq.forEach((val,i)=>{
const node=document.createElement('div');
node.className='trail-node';node.textContent=val;
node.style.left=pts[i].x+'px';node.style.top=pts[i].y+'px';
node.addEventListener('pointerdown',ev=>{
ev.preventDefault();
if(!S.active||!S.waiting||node.classList.contains('done'))return;
const cum=Math.round(performance.now()-S.t0);
if(val===seq[S.ctx.next]){
const from=S.ctx.next===0?'Başla':seq[S.ctx.next-1];
const leg=cum-S.ctx.lastCum;
S.ctx.lastCum=cum;
beep(400+S.ctx.next*30,0.1);
node.classList.add('done');
const c={x:pts[i].x+sz/2,y:pts[i].y+sz/2};
if(S.ctx.prev){
const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
ln.setAttribute('x1',S.ctx.prev.x);ln.setAttribute('y1',S.ctx.prev.y);
ln.setAttribute('x2',c.x);ln.setAttribute('y2',c.y);
ln.setAttribute('stroke','#00e676');ln.setAttribute('stroke-width','3');
svg.appendChild(ln);
}
S.ctx.prev=c;S.ctx.next++;
record({correct:true,rt:leg,cum:cum,note:from+'→'+val,cond:isReal?'REAL':st,resp:String(val),practice:!isReal});
if(S.ctx.next>=seq.length){
S.waiting=false;fb(true);
if(isReal){T.set(finishTest,400);}
else{S.ctx.stage=st==='P1'?'P2':'REAL';T.set(MODS[S.mod].trial,1000);}
}
}else{
record({correct:false,rt:null,cum:cum,note:'Sıra Hatası ('+val+', beklenen '+seq[S.ctx.next]+')',cond:isReal?'REAL':st,resp:String(val),practice:!isReal});
fb(false);beep(150,0.2);
}
});
trailArea.appendChild(node);
});
startClock();
S.t0=performance.now();S.waiting=true;
}
};
}

if(!(age>=5&&age<=99)){alert('Yaş 5–99 arasında olmalı.');return null;}
if(!(exp>=0&&exp<=80)){alert('Spor yılı 0–80 arasında olmalı.');return null;}
return{id:id,age:age,exp:exp,gender:$('athlete-gender').value,sport:$('athlete-sport').value.trim().slice(0,32)||'Genel',dominant:$('athlete-dominant').value,screen:screen.width+'x'+screen.height+'@'+(window.devicePixelRatio||1),ua:navigator.userAgent};
}

function resetLayout(keepStats){
T.clear();stopClock();
const mod=moduleSelect.value,m=MODS[mod];
instructionCard.style.display='block';
$('instr-eval').style.display='';$('instr-score-formula').style.display='';
$('instr-title').textContent=m.title;$('instr-text').textContent=m.text;
$('instr-eval').textContent=m.eval;$('instr-score-formula').textContent=m.formula;
$('opt-digit').style.display=mod==='digit_span'?'flex':'none';
$('opt-nback').style.display=mod==='nback'?'flex':'none';
[circle,zoneBox,dualButtons,spatialGrid,memoryGrid,numpadGrid,trailArea].forEach(e=>e.style.display='none');
circle.className='';gameArea.classList.remove('has-buttons');
memoryGrid.innerHTML='';trailArea.innerHTML='';
if(!keepStats){
statTimer.textContent='0.00 s';statScore.textContent='0';statErrors.textContent='0';
statTrials.textContent=m.open?'–':('0/'+m.total);
}
}

function startTest(){
const athlete=readAthlete();if(!athlete)return;
const mod=moduleSelect.value,m=MODS[mod];
S.run++;S.active=true;S.mod=mod;S.athlete=athlete;
S.rows=[];S.idx=0;S.waiting=false;S.resp=null;S.ctx={};
S.total=m.total||0;S.practiceN=m.practice||0;
S.sessionId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
resetLayout(false);
instructionCard.style.display='none';
$('opt-digit').style.display='none';$('opt-nback').style.display='none';
startBtn.disabled=true;stopBtn.disabled=false;exportBtn.disabled=true;moduleSelect.disabled=true;
m.setup();
requestWake();
startClock();
nextTrial();
}

function endUI(){startBtn.disabled=false;stopBtn.disabled=true;moduleSelect.disabled=false;exportBtn.disabled=S.rows.length===0;}

function stopTest(msg){
S.active=false;S.run++;S.waiting=false;S.resp=null;
T.clear();stopClock();releaseWake();
if('speechSynthesis' in window)speechSynthesis.cancel();
resetLayout(true);
if(typeof msg==='string')$('instr-text').textContent=msg+' '+MODS[moduleSelect.value].text;
endUI();
}

function finishTest(){
if(!S.active)return;
const elapsed=((performance.now()-S.clockStart)/1000).toFixed(1);
S.active=false;S.run++;S.waiting=false;S.resp=null;
T.clear();stopClock();releaseWake();
const m=MODS[S.mod],r=S.rows.filter(x=>!x.practice),score=computeScore();
const lines=['Süre: '+elapsed+' sn','<b>Puan: '+score+'</b>'];
if(r.length){
if(['trailA','trailB','memory','digit_span'].indexOf(S.mod)<0){
lines.push('Doğruluk: %'+Math.round(okRows(r).length/r.length*100));
const rts=r.filter(x=>x.correct&&x.rt!=null).map(x=>x.rt);
if(rts.length){
const best=Math.min.apply(null,rts),worst=Math.max.apply(null,rts);
lines.push('Ort. tepki süresi: '+msSn(Math.round(mean(rts))),
'<span style="color:#00e676">En iyi: '+msSn(best)+'</span>',
'<span style="color:#ff5252">En kötü: '+msSn(worst)+'</span>',
'Fark (en kötü − en iyi): '+(worst-best)+' ms',
'Tüm süreler (ms): '+rts.join(' · '));
}else lines.push('Geçerli tepki süresi yok (doğru cevap yok).');
}
lines.push('Hata: '+errCount(r));
if(m.extra)Array.prototype.push.apply(lines,m.extra(r));
}
resetLayout(true);
$('instr-title').textContent="Test Tamamlandı!";
$('instr-text').innerHTML=lines.join('<br>');
$('instr-eval').style.display='none';$('instr-score-formula').style.display='none';
endUI();
saveSession();
}

/* ---------- Veri ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function setSync(t){$('sync-status').textContent=t;}
function saveSession(){
if(!S.rows.length)return;
const all=lsGet('spplab_sessions');all.push({sessionId:S.sessionId,rows:S.rows});
lsSet('spplab_sessions',all.slice(-30));
if($('consent').checked&&API_URL){
const q=lsGet('spplab_pending');q.push({sessionId:S.sessionId,rows:S.rows});lsSet('spplab_pending',q);
flushPending();
}else setSync($('consent').checked?'API_URL tanımlı değil: veri cihazda.':'Rıza verilmedi: veri sadece cihazda.');
}
async function flushPending(){
if(!API_URL||!$('consent').checked)return;
const q=lsGet('spplab_pending');if(!q.length)return;
const rest=[];
for(const b of q){
try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:API_TOKEN,sessionId:b.sessionId,rows:b.rows})});}
catch(e){rest.push(b);}
}
lsSet('spplab_pending',rest);
setSync(rest.length?(rest.length+' oturum gönderilmeyi bekliyor'):'Gönderildi (sunucu yanıtı doğrulanamaz)');
}
window.addEventListener('online',flushPending);

const CSV_COLS=[['sessionId','Oturum_ID'],['timestamp','Zaman_Damgasi'],['version','Surum'],['athleteId','Sporcu_ID'],['age','Yas'],['gender','Cinsiyet'],['sport','Brans'],['dominantSide','Baskin_Taraf'],['experienceYears','Deneyim_Yili'],['screen','Ekran'],['userAgent','Tarayici'],['module','Modul'],['trial','Deneme'],['practice','Alistirma'],['condition','Kosul'],['response','Yanit'],['rt','Reaksiyon_veya_Aralik_ms'],['cum','Kumulatif_ms'],['correct','Dogru_Mu'],['note','Aciklama'],['score','Hesaplanan_Puan']];
function csvEsc(v){
if(v===null||v===undefined)return'';
let s=String(v);
if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;
if(/[",;\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
return s;
}
function exportCSV(){
if(!S.rows.length)return;
const head=CSV_COLS.map(c=>c[1]).join(',');
const body=S.rows.map(r=>CSV_COLS.map(c=>csvEsc(r[c[0]])).join(',')).join('\n');
const blob=new Blob(["\uFEFF"+head+"\n"+body],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='SPPLab_'+(S.athlete?S.athlete.id:'data')+'_'+S.mod+'_'+new Date().toISOString().slice(0,10)+'.csv';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- Olaylar ---------- */
moduleSelect.addEventListener('change',()=>resetLayout(false));
startBtn.addEventListener('click',()=>{initAudio();startTest();});
stopBtn.addEventListener('click',()=>stopTest());
exportBtn.addEventListener('click',exportCSV);
circle.addEventListener('pointerdown',e=>input('circle',e));
$('antisaccade-left-zone').addEventListener('pointerdown',e=>input('zoneL',e));
$('antisaccade-right-zone').addEventListener('pointerdown',e=>input('zoneR',e));
btnLeft.addEventListener('pointerdown',e=>input('left',e));
btnRight.addEventListener('pointerdown',e=>input('right',e));
cones.forEach(c=>c.addEventListener('pointerdown',e=>input('cone:'+c.dataset.key,e)));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.active)stopTest('Sekme arka plana alındığı için test durduruldu.');});

resetLayout(false);
flushPending();
</script>
